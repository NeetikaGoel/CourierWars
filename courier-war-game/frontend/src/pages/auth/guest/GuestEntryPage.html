<section class="guest-page">
    <form class="guest-card" data-guest-form>
      <button class="guest-back" type="button" data-back-button>← Back</button>
  
      <h1>Continue as Guest</h1>
      <p>Play now without registered login</p>
  
      <label>
        Guest Name Optional
        <input data-guest-name name="name" maxlength="40" placeholder="Guest Courier" />
      </label>
  
      <div class="guest-error" data-page-error hidden></div>
      <div class="guest-loading" data-page-loading hidden></div>
  
      <button class="guest-submit" type="submit">Start as Guest</button>
    </form>
  </section>
