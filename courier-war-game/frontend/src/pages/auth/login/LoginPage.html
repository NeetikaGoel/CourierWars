<section class="login-page">
    <form class="login-card" data-login-form>
      <button class="login-back" type="button" data-back-button>← Back</button>
  
      <h1>Login</h1>
      <p>Continue your Courier War profile</p>
  
      <label>
        Username or Email
        <input data-login-identifier name="identifier" autocomplete="username" />
      </label>
  
      <label>
        Password
        <input data-login-password name="password" type="password" autocomplete="current-password" />
      </label>
  
      <div class="login-error" data-page-error hidden></div>
      <div class="login-loading" data-page-loading hidden></div>
  
      <button class="login-submit" type="submit" data-login-submit>Login</button>
  
      <button class="login-link" type="button" data-register-button>
        Create a new account
      </button>
    </form>
  </section>
