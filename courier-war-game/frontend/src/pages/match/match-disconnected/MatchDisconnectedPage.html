<section class="match-disconnected-page">
    <div class="match-disconnected-card">
      <h1>Match Connection Lost</h1>
      <p>
        The match state could not be loaded. This can happen if the cache server restarts
        or the active match expires.
      </p>
  
      <div class="match-disconnected-actions">
        <button type="button" data-retry-button>Retry</button>
        <button type="button" data-home-button>Return Home</button>
      </div>
    </div>
  </section>
