<section class="match-game-page">
    <div class="match-game-stage">
      <div id="phaser-game-container" data-phaser-container></div>
    </div>
  
    <aside class="match-game-hud" data-match-hud>
      <h2>Courier War</h2>
      <p data-match-status>Connecting...</p>
  
      <div class="match-game-hud-block">
        <strong>Timer</strong>
        <span data-match-timer>--</span>
      </div>
  
      <div class="match-game-hud-block">
        <strong>Role</strong>
        <span data-match-role>--</span>
      </div>
  
      <div class="match-game-hud-block">
        <strong>State Version</strong>
        <span data-match-version>0</span>
      </div>
  
      <div class="match-game-error" data-page-error hidden></div>
    </aside>
  </section>
