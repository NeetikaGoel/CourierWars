<section class="match-result-page">
    <div class="match-result-card">
      <p class="match-result-kicker">Match Complete</p>
      <h1 data-result-title>Result</h1>
      <p data-result-reason>Loading result...</p>
  
      <div class="match-result-grid">
        <div><span>Difficulty</span><strong data-result-difficulty>--</strong></div>
        <div><span>Time Remaining</span><strong data-result-time>--</strong></div>
        <div><span>Lives</span><strong data-result-lives>--</strong></div>
        <div><span>Progress</span><strong data-result-progress>--</strong></div>
        <div><span>Energy Spent</span><strong data-result-energy-spent>--</strong></div>
        <div><span>Energy Left</span><strong data-result-energy-left>--</strong></div>
      </div>
  
      <div class="match-result-error" data-page-error hidden></div>
      <div class="match-result-loading" data-page-loading hidden></div>
  
      <div class="match-result-actions">
        <button type="button" data-play-again-button>Play Again</button>
        <button type="button" data-home-button>Home</button>
      </div>
    </div>
  </section>
